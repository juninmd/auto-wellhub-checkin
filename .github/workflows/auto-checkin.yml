name: Auto Check-in

on:
  schedule:
    # Executa todo dia às 6:00 AM UTC (ajuste conforme necessário)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  check-in:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Executar check-in
        env:
          WELLHUB_EMAIL: ${{ secrets.WELLHUB_EMAIL }}
          WELLHUB_PASSWORD: ${{ secrets.WELLHUB_PASSWORD }}
          GYM_ID: ${{ secrets.GYM_ID }}
          ACTIVITY_ID: ${{ secrets.ACTIVITY_ID }}
        run: npm start
